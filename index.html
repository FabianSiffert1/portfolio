<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/siffertIo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1c" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <title>Fabian Siffert — Android & Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Fabian Siffert, a software developer from Düsseldorf, Germany, focused on Android, Kotlin and Jetpack Compose."
    />
    <link rel="canonical" href="https://siffert.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://siffert.io/" />
    <meta property="og:site_name" content="siffert.io" />
    <meta property="og:title" content="Fabian Siffert — Android & Software Developer" />
    <meta
      property="og:description"
      content="Portfolio of Fabian Siffert, a software developer from Düsseldorf, Germany, focused on Android, Kotlin and Jetpack Compose."
    />
    <meta property="og:image" content="https://siffert.io/siffertIo.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fabian Siffert — Android & Software Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Fabian Siffert, a software developer from Düsseldorf, Germany, focused on Android, Kotlin and Jetpack Compose."
    />
    <meta name="twitter:image" content="https://siffert.io/siffertIo.svg" />
  </head>
  <body>
    <script>
      // Runs before first paint: React sets data-theme only after mount, which would flash the wrong theme.
      document.documentElement.setAttribute(
        'data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      )
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
